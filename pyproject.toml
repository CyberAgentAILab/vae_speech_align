[project]
name = "vae-speech-align"
version = "0.1.1"
description = ""
authors = [{name = "Tomoki Koriyama", email = "t.koriyama@ieee.org"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numba>=0.60.0",
    "soundfile>=0.12.1",
    "torch>=2.11",
    "torchaudio>=2.4.1",
    "tqdm>=4.66.5",
    "praatio>=6.0.0",
    "omegaconf>=2.3.0",
    "tensorboard>=2.21.0",
    "transformers>=4.45.1",
    "torchcodec>=0.12",
    "g2p-en>=2.1.0",
    "nltk>=3.9",
    "safetensors>=0.4.0",
    "matplotlib>=3.9",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "pyproject-flake8>=6.1.0",
    "flake8-debugger>=4.1.2",
    "flake8-functions>=0.0.8",
    "flake8-cognitive-complexity>=0.1.0",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "pre-commit>=3.6.2",
    "pytest>=8.0.1",
    "jupyterlab>=4.2.5",
    "nbqa>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vae_speech_align"]

[tool.flake8]
max-line-length = 79
max-complexity = 10
select = "C,E,F,W,B"
ignore = "E203,W503,CFQ004,CCR001"
# Triton JIT kernels must take flat pointer/stride/scalar arguments and cannot
# accept grouped objects, so the argument-count rule (CFQ002) does not apply.
per-file-ignores = [
    "vae_speech_align/forwardsum/triton_likelihood_impl.py:CFQ002",
    "vae_speech_align/forwardsum/triton_viterbi_impl.py:CFQ002",
]

[tool.black]
line-length = 79
# Without an explicit list, black infers py310-py314 from
# requires-python, and its AST safety check warns (and can fail)
# when any target is newer than the running interpreter. List only
# versions up to the CI/dev Python (3.12); the output stays valid
# on newer interpreters.
target-version = ["py310", "py311", "py312"]
exclude = '''
(
    migrations
    | .mypy_cache
    | .pytest_cache
    | .tox
    | .venv
    | dist
)
'''

[tool.mypy]
# common
python_version = "3.10"
show_column_numbers  = true
show_error_context = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
# warning
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true

# Triton JIT kernels are written in the Triton DSL: their parameters are
# device pointers and tl.constexpr values, so Python type annotations are
# not meaningful there. Bodies are still checked (check_untyped_defs).
[[tool.mypy.overrides]]
module = [
    "vae_speech_align.forwardsum.triton_likelihood_impl",
    "vae_speech_align.forwardsum.triton_viterbi_impl",
]
disallow_untyped_defs = false

[tool.isort]
profile = "black"
line_length = 79

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
